[package]
name = "pmr"
version = "1.0.0"
edition = "2021"
description = "A Rust process manager for developers and coding agents, with a PM2-style CLI"
license = "AGPL-3.0-only"
authors = ["Liam Mendes <hello@liammendes.co.uk>"]
repository = "https://github.com/liammendes/pmr"
homepage = "https://github.com/liammendes/pmr"
readme = "README.md"
keywords = ["process-manager", "supervisor", "cli", "pm2", "automation"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]
default-run = "pmr"

[lib]
name = "pmr"
path = "src/lib.rs"

[[bin]]
name = "pmr"
path = "src/bin/pmr.rs"

[[bin]]
name = "pmr-runtime"
path = "src/bin/pmr-runtime.rs"

[[bin]]
name = "pmr-docker"
path = "src/bin/pmr-docker.rs"

[[bin]]
name = "pmr-dev"
path = "src/bin/pmr-dev.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help", "string"] }
cron = "0.12"
crossterm = "0.28"
json5 = "0.4"
libc = "0.2"
notify = "6.1"
ratatui = "0.29"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sysinfo = "0.32"
thiserror = "2.0"
tokio = { version = "1.41", features = ["full"] }
toml = "0.8"
unicode-width = "0.2"
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.13"
